name: Verify FishCrossLine

on:
  push:
    branches:
      - centerrotation
      - railway-publish
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - run: pnpm build
